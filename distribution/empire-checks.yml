name: Empire updater checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit ou tag de la version a verifier'
        required: false
        type: string
permissions:
  contents: read
jobs:
  updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Test updates, interruption, rollback and archive validation
        shell: powershell
        run: ./distribution/tests/Test-Updater.ps1
      - name: Compile Windows bootstrap
        shell: powershell
        run: ./distribution/Build.Bootstrap.ps1 -Output "$env:RUNNER_TEMP/Empire.exe"
