						Button@CREDITS_BUTTON:
							X: 16
							Y: 180
							Width: 278
							Height: 34
							Text: md-menu-credits
							Font: Bold
						Button@BACK_BUTTON:
							X: 16
							Y: 224
							Width: 278
							Height: 34
							Text: md-menu-back
							Font: Bold
							Key: escape
						Button@MUSIC_BUTTON:
							X: 16
