						Button@BACK_BUTTON:
							X: 16
							Y: 136
							Width: 278
							Height: 34
							Text: md-menu-back
							Font: Bold
							Key: escape
		Label@MD_FOOTER:
			X: WINDOW_WIDTH / 16
			Y: WINDOW_HEIGHT - 34
			Width: 500
			Height: 20
			Text: md-menu-footer
			Font: Tiny
			TextColor: C3B694
			Shadow: True
