	Mobile:
		Speed: 48
	Health:
		HP: 7000
	MedievalRecruitable:
		Food: 20
		Meat: 0
	MedievalStockpile:
		Capacity: 60, 60, 0, 60
	MedievalFoodProvider:
		Radius: 4c0
	MedievalSupplyCart:
	MedievalConstructionConvoy:
